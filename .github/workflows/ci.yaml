on:
    workflow_dispatch:
    pull_request:
      branches:
        - main
      types:
        - opened
        - reopened
      paths-ignore: # ignore pull requests on documentation files
        - README.md



jobs:

  test-ui-accessibility:

    runs-on: ubuntu-latest
    #needs: build
  
    steps:

      - name: check all service UIs are accessible
        env:
          TEST_SERVICES: ( "minio,9000" "mlflow,5000" "airflow,8080" "app-serving,8501" )
        run: for service in "${TEST_SERVICES[@]}"; do IFS=',' read -r svc port <<< "$service"; if [ ! curl -f http://localhost:$port ]; then echo "$svc UI is not accessible on port $port" && exit 1; else echo "$svc UI is accessible on port $port"; fi; done

  build:

    runs-on: ubuntu-latest
    
    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: show docker compose version
        run: docker compose version

      - name: set env variables from .env.demo file
        run: cp .env.demo .env

      - name: run airflow setup script
        run: |
          chmod +x ./setup-airflow.sh
          ./setup-airflow.sh

      - name: build docker-compose stack images
        timeout-minutes: 5
        run: docker compose build

      - name: create docker-compose stack
        timeout-minutes: 5
        run: docker compose up -d

      - name: check all services are healthy
        run: if [ docker compose ps | grep -i "(unhealthy)" ]; then echo "Some services are unhealthy" && exit 1; else echo "All services are healthy"; fi

  
