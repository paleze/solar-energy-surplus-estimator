

secrets:
   minio_root_user:
     environment: MINIO_ROOT_USER
   minio_root_password:
     environment: MINIO_ROOT_PASSWORD
   postgres_user:
    environment: POSTGRES_USER
   postgres_password:
    environment: POSTGRES_PASSWORD


services:
  
  # Minio Object Storage
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    ports:
      - "${MINIO_HOST_API_PORT}:9000" # API port
      - "${MINIO_HOST_CONSOLE_PORT}:9001" # console port
    command: server /data --console-address ":9001"
    secrets:
      - minio_root_user
      - minio_root_password
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - ${MINIO_DATA_PATH}:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3


  # Minio Client to initialize buckets, exits after creation
  minio-init:
    container_name: minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio_root_user
      - minio_root_password
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BUCKET_NAMES: "${MINIO_BUCKET_NAMES}"
      MINIO_HOST: ${MINIO_HOST}
    entrypoint: > 
      /bin/sh -c "
        mc alias set minio http://${MINIO_HOST}:9000 $(cat /run/secrets/minio_root_user) $(cat /run/secrets/minio_root_password);
        for bucket in $(echo \"${MINIO_BUCKET_NAMES}\" | tr \",\" \"\\n\" ); 
            do mc mb minio/\"$${bucket}\" --ignore-existing; 
            mc anonymous set public minio/\"$${bucket}\";
        done;
      "

  postgres:
    image: postgres:15
    container_name: mlflow-postgres
    secrets:
      - postgres_user
      - postgres_password
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat $${POSTGRES_USER_FILE})"]
      interval: 5s
      timeout: 3s
      retries: 10

    
  mlflow:
    image: ghcr.io/mlflow/mlflow:${MLFLOW_VERSION}
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    secrets:
      - minio_root_user
      - minio_root_password
    environment:
      # Backend store URI built from vars
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}

      # S3/MinIO settings
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      MLFLOW_ARTIFACTS_DESTINATION: ${MLFLOW_ARTIFACTS_DESTINATION}

      AWS_ACCESS_KEY_ID_FILE: /run/secrets/minio_root_user
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_root_password

      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      MLFLOW_S3_IGNORE_TLS: "true"

      # Server host/port
      MLFLOW_HOST: ${MLFLOW_HOST}
      MLFLOW_PORT: ${MLFLOW_PORT}

    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary boto3
        mlflow server \
          --backend-store-uri "${MLFLOW_BACKEND_STORE_URI}" \
          --artifacts-destination "${MLFLOW_ARTIFACTS_DESTINATION}" \
          --serve-artifacts \
          --host "${MLFLOW_HOST}" \
          --port "${MLFLOW_PORT}"
    ports:
      - "${MLFLOW_PORT}:${MLFLOW_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${MLFLOW_PORT}/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30