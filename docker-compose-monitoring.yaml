# Project name
name: "monitoring"


secrets:
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

services:

  # Prometheus for metric collection
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "${PROMETHEUS_PORT:-9099}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: [ "CMD-SHELL", "nc -v localhost 9090" ]
      interval: 15s
      timeout: 10s
      retries: 5


  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:12.4.2
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    secrets:
      - grafana_admin_password
    environment:
      # NOTE: double underscore "__" IN "GF_SECURITY_ADMIN_PASSWORD__FILE" IS *NOT* A TYPO, IT WORKS THIS WAY AS PER GRAFANA DOCUMENTATION
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:$${GRAFANA_PORT:-3000}" ]
      interval: 15s
      timeout: 10s
      retries: 3


