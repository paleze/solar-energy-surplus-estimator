on:
    workflow_dispatch:
    pull_request:
      branches:
        - main
      types:
        - opened
        - reopened
      paths-ignore: # ignore pull requests on documentation files
        - README.md



jobs:


  build:

    runs-on: ubuntu-latest
    #permissions: write-all
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    
    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set env variables from .env.demo file
        run: cp .env.demo .env

      - name: run airflow setup script
        run: ./setup-airflow.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build and cache airflow custom docker image
        uses: docker/build-push-action@v6
        env:
          AIRFLOW_IMAGE_CACHE_KEY: estimator-custom-airflow-${{hashFiles('airflow-requirements.txt')}}
          AIRFLOW_CUSTOM_IMAGE_NAME: estimator-custom-airflow
        with:
          context: .
          file: ./airflow.Dockerfile
          tags: ghcr.io/${{ github.actor }}/${{ env.AIRFLOW_CUSTOM_IMAGE_NAME }}:latest
          #tags: ${{ env.AIRFLOW_CUSTOM_IMAGE_NAME }}:latest
          build-args: |
            AIRFLOW_VERSION=${{env.AIRFLOW_VERSION || '3.1.6' }}
            AIRFLOW_IMAGE_NAME=${{env.AIRFLOW_IMAGE_NAME || 'apache/airflow' }}
          push: true
          load: true
          cache-from: type=gha,scope=${{env.AIRFLOW_IMAGE_CACHE_KEY}}
          cache-to: type=gha,mode=max,scope=${{env.AIRFLOW_IMAGE_CACHE_KEY}}
          # tags: >
          #   ${{ env.CUSTOM_IMAGE_NAME }}:${{ github.sha }},
          #   ${{ env.CUSTOM_IMAGE_NAME }}:latest

      # - name: list docker images
      #   run: docker images

      # - name: push docker image to GitHub Container Registry
      #   run: docker push ghcr.io/${{ github.actor }}/estimator-custom-airflow:latest

      - name: Build and cache app-serving docker image
        uses: docker/build-push-action@v6
        with: 
          context: .
          file: ./app-serving.Dockerfile
          tags: estimator-app-serving:latest
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE || 'python:3.13.12-slim' }}
          push: false
          load: true
          cache-from: type=gha,scope=estimator-app-serving-${{hashFiles('app-serving.py')}}-${{hashFiles('weather_data.py')}}
          cache-to: type=gha,mode=max,scope=estimator-app-serving-${{hashFiles('app-serving.py')}}-${{hashFiles('weather_data.py')}}

      - name: set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: show docker compose version
        run: docker compose version

      - name: create docker-compose stack
        timeout-minutes: 5
        run: docker compose up -d

      - name: check all services are healthy
        run: |
          if  docker compose ps | grep -i "(unhealthy)"; then
            echo "Some services are unhealthy" && exit 1
          else 
            echo "All services are healthy"
          fi

      - name: check running containers
        run: docker ps --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: check services endpoints
        continue-on-error: true
        env:
          TEST_SERVICES: ( minio-api:9000 minio-console:9001 mlflow:5000 airflow:8080 app-serving:8501 )
        run: |
          SVC_LIST=${{env.TEST_SERVICES}}
          for service in "${SVC_LIST[@]}"; do 
            IFS=':' read -r svc port <<< "$service"
            if curl -s -o /dev/null http://localhost:${port}; then 
              echo "$svc UI is accessible on port $port"
            else 
              echo "$svc UI is NOT accessible on port $port" && exit 1
            fi 
          done

