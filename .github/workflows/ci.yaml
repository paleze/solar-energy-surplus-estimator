on:
    workflow_dispatch:
    pull_request:
      branches:
        - main
      types:
        - opened
        - reopened
      paths-ignore: # ignore pull requests on documentation files
        - README.md



jobs:


  build:

    runs-on: ubuntu-latest
    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: set env variables from .env.demo file
        run: cp .env.demo .env

      - name: run airflow setup script
        run: ./setup-airflow.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build and cache airflow custom docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./airflow.Dockerfile
          tags: estimator-custom-airflow:latest
          build-args: |
            AIRFLOW_VERSION=${{env.AIRFLOW_VERSION || '3.1.6' }}
            AIRFLOW_IMAGE_NAME=${{env.AIRFLOW_IMAGE_NAME || 'apache/airflow' }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and cache app-serving docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app-serving.Dockerfile
          tags: estimator-app-serving:latest
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE || 'python:3.13.12-slim' }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: show docker compose version
        run: docker compose version

      - name: create docker-compose stack
        timeout-minutes: 5
        run: docker compose up -d

      - name: check all services are healthy
        run: if [ docker compose ps | grep -i "(unhealthy)" ]; then echo "Some services are unhealthy" && exit 1; else echo "All services are healthy"; fi

  
  test-ui:

    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    strategy:
      matrix:
        include:
          - port: 9001
            service: minio
          - port: 5000
            service: mlflow
          - port: 8080
            service: airflow
          - port: 8501
            service: app-serving
    steps:

      - name: Check endpoints
        run: |
          echo "Checking if ${{matrix.service}} is accessible on port ${{matrix.port}}"
          curl -f http://localhost:${{ matrix.port }}
  
