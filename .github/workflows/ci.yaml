on:
    workflow_dispatch:
    pull_request:
      branches:
        - main
      types:
        - opened
        - reopened
      paths-ignore: # ignore pull requests on documentation files
        - README.md



jobs:

  build:

    runs-on: ubuntu-latest
    
    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: show docker compose version
        run: docker compose version

      - name: set env variables from .env.demo file
        run: cp .env.demo .env

      - name: run airflow setup script
        run: ./setup-airflow.sh

      - name: set cache airflow docker image
        id: cache-custom-airflow-image
        uses: actions/cache@v4
        with:
          path: ci/cache/docker/custom-airflow-image
          key: ${{runner.os}}-custom-airflow-image-${{hashfile('airflow.Dockerfile','airflow-requirements.txt')}}

      - name: update custom airflow image if cache miss
        timeout-minutes: 5
        if: steps.cache-custom-airflow-image.outputs.cache-hit != 'true'
        run: |
          ./airflow-build.sh
          mkdir -p ci/cache/docker/custom-airflow-image
          docker save estimator-custom-airflow:latest -o ./ci/cache/docker/custom-airflow-image/estimator-custom-airflow.tar

      - name: load custom airflow image if cache hit
        if: steps.cache-custom-airflow-image.outputs.cache-hit == 'true'
        run: |
          docker image load --input ./ci/cache/docker/custom-airflow-image/estimator-custom-airflow.tar
        
      - name: create docker-compose stack
        timeout-minutes: 5
        run: docker compose up -d

      - name: check all services are healthy
        run: if [ docker compose ps | grep -i "(unhealthy)" ]; then echo "Some services are unhealthy" && exit 1; else echo "All services are healthy"; fi

  
  test-ui-accessibility:

    runs-on: ubuntu-latest
    needs: build
  
    steps:

      - name: check all service UIs are accessible
        env:
          TEST_SERVICES: ( "minio,9000" "mlflow,5000" "airflow,8080" "app-serving,8501" )
        run: for service in "${TEST_SERVICES[@]}"; do IFS=',' read -r svc port <<< "$service"; curl -s -o /dev/null http://localhost:$port; res=$? ; if [ $res -ne 0 ]; then echo "$svc UI is not accessible on port $port" && exit 1; else echo "$svc UI is accessible on port $port"; fi; done  
