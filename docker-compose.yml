
# Docker Compose configuration for Minio Object Storage
# start: docker compose --env-file docker-compose.env up -d
# stop:  docker compose --env-file docker-compose.env down

secrets:
   minio_root_user:
     file: minio_root_user.txt
   minio_root_password:
     file: minio_root_password.txt


services:
  
  # Minio Object Storage
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    ports:
      - "${MINIO_HOST_API_PORT}:9000" # API port
      - "${MINIO_HOST_CONSOLE_PORT}:9001" # console port
    command: server /data --console-address ":9001"
    secrets:
      - minio_root_user
      - minio_root_password
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - ${MINIO_DATA_PATH}:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3


  # Minio Client to initialize buckets, exits after creation
  minio-init:
    container_name: minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio_root_user
      - minio_root_password
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BUCKET_NAMES: "${MINIO_BUCKET_NAMES}"
    entrypoint: > 
      /bin/sh -c "
        mc alias set minio http://minio:9000 $(cat /run/secrets/minio_root_user) $(cat /run/secrets/minio_root_password);
        for bucket in $(echo \"${MINIO_BUCKET_NAMES}\" | tr \",\" \"\\n\" ); 
            do mc mb minio/\"$${bucket}\" --ignore-existing; 
            mc anonymous set public minio/\"$${bucket}\";
        done;
      "
    

